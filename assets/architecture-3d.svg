<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">How the current preview works</title><desc id="desc">GitHub Pages serves static files to the browser. JavaScript controllers render the pages and save demo changes in local storage. No authentication server or shared database is connected.</desc>
<rect width="1000" height="380" rx="20" fill="#faf5ea"/>
<text x="42" y="55" font-family="Arial,sans-serif" font-size="26" font-weight="800">A simple preview. Clear boundaries.</text>
<g fill="#fff" stroke="#121212" stroke-width="2">
<rect x="42" y="108" width="264" height="148" rx="12"/>
<rect x="368" y="108" width="264" height="148" rx="12"/>
<rect x="694" y="108" width="264" height="148" rx="12"/>
</g>
<path d="M308 182h54m-8-7 8 7-8 7m280-7h54m-8-7 8 7-8 7" fill="none" stroke="#386b80" stroke-width="3"/>
<g font-family="Arial,sans-serif" fill="#121212">
<text x="64" y="144" font-size="12" font-weight="700" fill="#a52d35">01 / DELIVERY</text>
<text x="64" y="180" font-size="24" font-weight="800">GitHub Pages</text>
<text x="64" y="216" font-size="16">HTML · CSS · bundled JS</text>
<text x="390" y="144" font-size="12" font-weight="700" fill="#a52d35">02 / EXPERIENCE</text>
<text x="390" y="180" font-size="24" font-weight="800">Your browser</text>
<text x="390" y="216" font-size="16">Directories · timers · 3D</text>
<text x="716" y="144" font-size="12" font-weight="700" fill="#a52d35">03 / DEMO STATE</text>
<text x="716" y="180" font-size="24" font-weight="800">Local storage</text>
<text x="716" y="216" font-size="16">Only on this device</text>
</g>
<rect x="42" y="289" width="916" height="49" rx="8" fill="#f2e8cb"/>
<text x="63" y="320" font-family="Arial,sans-serif" font-size="16" fill="#49463b">Real student/admin accounts require an auth service, shared database and server-enforced permissions.</text>
</svg>
