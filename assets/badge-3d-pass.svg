<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="passBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>

    <linearGradient id="cardHoloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="35%" stop-color="#7000ff" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#05ffa1" />
    </linearGradient>

    <linearGradient id="foilSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.75)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <filter id="brutalShadowPass" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes sheenSweep {
        0% { transform: translateX(-300px) skewX(-20deg); }
        100% { transform: translateX(600px) skewX(-20deg); }
      }
      @keyframes scanLaser {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(70px); opacity: 0.9; }
      }
      .pass-float { animation: floatCard 4.5s ease-in-out infinite; transform-origin: center; }
      .holo-sheen { animation: sheenSweep 4s ease-in-out infinite; }
      .laser-scan { animation: scanLaser 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="320" fill="url(#passBgGrad)" rx="8" />
  <rect x="8" y="8" width="784" height="304" fill="none" stroke="#252c38" stroke-width="1.5" rx="6" />

  <!-- 3D ISOMETRIC PASS CARD (LEFT) -->
  <g class="pass-float" transform="translate(60, 30)">
    <!-- Base Card Shadow -->
    <polygon points="180,20 380,80 220,250 20,190" fill="#000000" filter="url(#brutalShadowPass)" />
    <!-- Base Card Slab -->
    <polygon points="180,20 380,80 220,250 20,190" fill="#ffffff" stroke="#121212" stroke-width="3" />

    <!-- Top Card Header Strip -->
    <polygon points="180,20 380,80 345,120 145,60" fill="url(#cardHoloGrad)" stroke="#121212" stroke-width="2" />
    <text x="210" y="66" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" transform="rotate(17, 210, 66)">
      UGSOT VERIFIED HACKER PASS
    </text>

    <!-- Holographic Sheen Layer -->
    <g clip-path="url(#passClip)">
      <rect x="0" y="0" width="80" height="260" fill="url(#foilSheen)" class="holo-sheen" opacity="0.4" />
    </g>

    <!-- QR Code Block in Isometric Plane -->
    <g transform="translate(60, 95) rotate(17)">
      <rect x="0" y="0" width="85" height="85" fill="#121212" rx="4" />
      <!-- Target Corner Finders -->
      <rect x="6" y="6" width="22" height="22" fill="#00f0ff" />
      <rect x="11" y="11" width="12" height="12" fill="#121212" />
      <rect x="57" y="6" width="22" height="22" fill="#00f0ff" />
      <rect x="62" y="11" width="12" height="12" fill="#121212" />
      <rect x="6" y="57" width="22" height="22" fill="#00f0ff" />
      <rect x="11" y="62" width="12" height="12" fill="#121212" />
      <!-- Matrix Pixels -->
      <rect x="36" y="10" width="10" height="10" fill="#ffe600" />
      <rect x="36" y="28" width="12" height="12" fill="#05ffa1" />
      <rect x="16" y="38" width="10" height="10" fill="#ff3366" />
      <rect x="58" y="38" width="18" height="8" fill="#fff" />
      <rect x="36" y="52" width="10" height="10" fill="#ff3366" />
      <rect x="52" y="62" width="18" height="14" fill="#00f0ff" />

      <!-- Scanning Laser Line -->
      <line x1="0" y1="10" x2="85" y2="10" stroke="#ff3366" stroke-width="2.5" class="laser-scan" />
    </g>

    <!-- Attendee Details -->
    <g transform="translate(170, 135) rotate(17)">
      <text x="0" y="0" fill="#121212" font-family="'Impact', sans-serif" font-size="16">ADITYA SHARMA</text>
      <text x="0" y="15" fill="#4a5568" font-family="'Courier New', monospace" font-size="9" font-weight="bold">ID: UGSOT-2026-0042</text>
      
      <rect x="0" y="24" width="75" height="18" rx="4" fill="#05ffa1" stroke="#121212" stroke-width="1.5" />
      <text x="8" y="37" fill="#121212" font-family="sans-serif" font-size="9.5" font-weight="900">+150 DEV XP</text>

      <text x="0" y="58" fill="#ff3366" font-family="'Courier New', monospace" font-size="8" font-weight="bold">HASH: 9e3f...78cb</text>
    </g>

    <!-- Lanyard Clip Eyelet -->
    <ellipse cx="280" cy="50" rx="14" ry="7" fill="#4a5568" stroke="#121212" stroke-width="2" />
    <ellipse cx="280" cy="50" rx="6" ry="3" fill="#121212" />
  </g>

  <!-- INFO DESCRIPTION SIDE (RIGHT) -->
  <g transform="translate(430, 45)">
    <rect x="0" y="0" width="320" height="230" rx="8" fill="#161f2c" stroke="#121212" stroke-width="2.5" filter="url(#brutalShadowPass)" />
    
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="150" height="22" rx="4" fill="#ffe600" stroke="#121212" stroke-width="1.5" />
      <text x="8" y="15" fill="#121212" font-family="'Courier New', monospace" font-size="10" font-weight="900">⚡ CLIENT-SIDE ENGINE</text>

      <text x="0" y="44" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="20">Dynamic Canvas QR Pass</text>
      
      <text x="0" y="68" fill="#a0aec0" font-family="sans-serif" font-size="12" line-height="1.5">
        <tspan x="0" dy="0">• Zero external API calls or tracking</tspan>
        <tspan x="0" dy="20">• Cryptographic SHA-256 verification hash</tspan>
        <tspan x="0" dy="20">• Instant download as PNG badge</tspan>
        <tspan x="0" dy="20">• Awards +150 Dev XP on registration</tspan>
        <tspan x="0" dy="20">• Real-time offline check-in compatibility</tspan>
      </text>

      <!-- Neo Tech Chips -->
      <g transform="translate(0, 135)">
        <rect x="0" y="0" width="75" height="20" rx="3" fill="#ff3366" stroke="#121212" stroke-width="1.5" />
        <text x="6" y="14" fill="#fff" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold">HTML5 Canvas</text>

        <rect x="85" y="0" width="70" height="20" rx="3" fill="#00f0ff" stroke="#121212" stroke-width="1.5" />
        <text x="91" y="14" fill="#121212" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold">Web Crypto</text>

        <rect x="165" y="0" width="60" height="20" rx="3" fill="#05ffa1" stroke="#121212" stroke-width="1.5" />
        <text x="171" y="14" fill="#121212" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold">Web Audio</text>
      </g>
    </g>
  </g>
</svg>