<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Event pass design preview</title><desc id="desc">A sample tilted event badge beside a notice explaining that this browser-local pass is not valid for admission.</desc>
<rect width="1000" height="420" rx="20" fill="#ece8df"/>
<text x="54" y="109" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5b625e">A SMALL DETAIL. A BETTER EXPERIENCE.</text>
<text x="54" y="172" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#121212">Your next event,</text>
<text x="54" y="220" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#121212">in a new dimension.</text>
<text x="54" y="273" font-family="Arial,sans-serif" font-size="18" fill="#4b514d">2D and interactive 3D sample passes.</text>
<text x="54" y="309" font-family="Arial,sans-serif" font-size="16" fill="#4b514d">Preview only — no admission or QR verification.</text>
<g transform="translate(658 43) rotate(8 120 160)">
<rect x="8" y="10" width="240" height="320" rx="16" fill="#b6ad98" stroke="#121212" stroke-width="2"/>
<rect width="240" height="320" rx="16" fill="#faf5ea" stroke="#121212" stroke-width="2"/>
<path d="M16 0h208q16 0 16 16v57H0V16Q0 0 16 0" fill="#ffd166" stroke="#121212" stroke-width="2"/>
<rect x="91" y="13" width="58" height="7" rx="3" fill="#a68c4b"/>
<text x="23" y="51" font-family="Arial,sans-serif" font-size="20" font-weight="800">UGSOT / BUILDERS</text>
<text x="24" y="111" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">SAMPLE EVENT PASS</text>
<text x="24" y="152" font-family="Arial,sans-serif" font-size="27" font-weight="800">Hello, builder.</text>
<text x="24" y="182" font-family="Arial,sans-serif" font-size="14">Open Source Community</text>
<path d="M24 208h192" stroke="#d4cbb8"/>
<text x="24" y="243" font-family="monospace" font-size="17" fill="#386b80">&lt; / &gt;</text>
<text x="24" y="290" font-family="Arial,sans-serif" font-size="12" font-weight="700">DEMO ONLY · NO VENUE ENTRY</text>
</g></svg>
